services:
  voltcoach-for-docker:
    build: .
    image: voltcoach-for-docker:latest
    container_name: voltcoach-for-docker
    ports:
      - "3333:3000"
    environment:
      # 确保容器内目录与镜像默认值一致
      FIT_INPUT_DIR: /input
      FIT_OUTPUT_DIR: /output
      FIT_DB_PATH: /app/db/fitness.db
      # AI 报告呈现训练时间所用时区（训练数据一律 UTC 存储，按此设置换算呈现）。
      # 不设置时容器默认 UTC，本地傍晚的骑行会被 AI 读成中午。改成你的 IANA 时区名。
      TZ: Asia/Shanghai
    volumes:
      # 必须挂载：输入 FIT 文件与输出结果
      - ./input:/input
      - ./output:/output
      # 强烈建议挂载：训练库持久化（含骑手参数与 AI 密钥设置），避免容器重建后数据丢失
      - ./db:/app/db
      # 可选：仅在需要调整算法阈值 / 骑手参数出厂默认值时挂载
      # （日常改 FTP / 体重直接在 Web 设置页操作，存训练库）
      - ./src/settings.js:/app/src/settings.js
    restart: unless-stopped
